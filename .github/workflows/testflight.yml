name: TestFlight Distribution

on:
  push:
    branches:
      - testflight
      - main
  workflow_dispatch:

concurrency:
  group: testflight-augenda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build and Deploy to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apple Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.ASC_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ASC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "Installing Apple Distribution Certificate into temporary keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=temporary-build-password
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm -f $RUNNER_TEMP/cert.p12
          fi

      - name: Set up App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_CONTENT" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive AuGenda for Release
        run: |
          mkdir -p build
          xcodebuild archive \
            -project AuGenda.xcodeproj \
            -scheme AuGenda \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AuGenda.xcarchive \
            -allowProvisioningUpdates \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee xcodebuild-archive.log || (tail -n 120 xcodebuild-archive.log && exit 1)

      - name: Package .ipa for Sideloading & TestFlight
        run: |
          mkdir -p build/TestFlight/Payload
          APP_PATH=$(find build/AuGenda.xcarchive -name "AuGenda.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/AuGenda.xcarchive -name "*.app" -type d | head -n 1)
          fi
          echo "Target App Path: $APP_PATH"
          cp -R "$APP_PATH" build/TestFlight/Payload/
          (cd build/TestFlight && zip -qr AuGenda.ipa Payload && rm -rf Payload)
          ls -lh build/TestFlight/AuGenda.ipa

      - name: Save Binary to GitHub Artifacts (Downloadable .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: AuGenda-iOS-Package
          path: build/TestFlight/AuGenda.ipa

      - name: Deploy to TestFlight (Optional)
        continue-on-error: true
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AuGenda.xcarchive \
            -exportOptionsPlist ExportOptions-TestFlight.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee xcodebuild-upload.log || echo "TestFlight upload skipped or requires account billing resolution."
