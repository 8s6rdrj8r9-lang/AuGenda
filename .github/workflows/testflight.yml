name: TestFlight Distribution

on:
  push:
    branches:
      - testflight
      - main
  workflow_dispatch:

concurrency:
  group: testflight-augenda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build and Deploy to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apple Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.ASC_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ASC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "Installing Apple Distribution Certificate into temporary keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=temporary-build-password
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm -f $RUNNER_TEMP/cert.p12
          fi

      - name: Set up App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_CONTENT" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build Release App for iOS
        run: |
          mkdir -p build/TestFlight
          set -o pipefail
          xcodebuild \
            -project AuGenda.xcodeproj \
            -scheme AuGenda \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/AuGenda-Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED ==="
              tail -n 120 xcodebuild.log
              exit 1
            }

      - name: Package .ipa for 7-Day Sideloading
        run: |
          set -e
          mkdir -p build/TestFlight/Payload
          APP_PATH=$(find "$RUNNER_TEMP/AuGenda-Build" -name "AuGenda.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "AuGenda.app" -type d | head -n 1)
          fi
          echo "Found AuGenda.app at: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: AuGenda.app was not found!"
            find "$RUNNER_TEMP" -maxdepth 5 || true
            exit 1
          fi
          cp -R "$APP_PATH" build/TestFlight/Payload/
          cd build/TestFlight
          zip -qr AuGenda.ipa Payload
          rm -rf Payload
          ls -lh AuGenda.ipa
          echo "IPA Size: $(stat -f%z AuGenda.ipa) bytes"

      - name: Upload AuGenda.ipa to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuGenda-iOS-ipa
          path: build/TestFlight/AuGenda.ipa

      - name: Build Release App for macOS
        run: |
          mkdir -p build/macOS
          set -o pipefail
          xcodebuild \
            -project AuGenda.xcodeproj \
            -scheme AuGenda \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/AuGenda-Mac-Build" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild-mac.log || {
              echo "=== XCODEBUILD MAC FAILED ==="
              tail -n 120 xcodebuild-mac.log
              exit 1
            }

      - name: Package macOS App for Distribution
        run: |
          set -e
          mkdir -p build/macOS
          APP_PATH=$(find "$RUNNER_TEMP/AuGenda-Mac-Build" -name "AuGenda.app" -type d | head -n 1)
          echo "Found macOS AuGenda.app at: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: macOS AuGenda.app was not found!"
            find "$RUNNER_TEMP/AuGenda-Mac-Build" -maxdepth 5 || true
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -qr "$GITHUB_WORKSPACE/build/macOS/AuGenda-macOS-arm64.zip" AuGenda.app
          cd "$GITHUB_WORKSPACE"
          ls -lh build/macOS/AuGenda-macOS-arm64.zip
          echo "Generated AuGenda-macOS-arm64.zip size: $(ls -lh build/macOS/AuGenda-macOS-arm64.zip | awk '{print $5}')"

      - name: Upload AuGenda macOS App to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuGenda-macOS-Package
          path: build/macOS/AuGenda-macOS-arm64.zip

      - name: Upload Build Log Artifact (Diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuGenda-Build-Log
          path: xcodebuild.log

      - name: Publish Diagnostic Log to Diagnostics Branch
        if: always()
        run: |
          if [ -f xcodebuild.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B diagnostics
            cp xcodebuild.log diagnostic_xcodebuild.log
            git add diagnostic_xcodebuild.log
            git commit -m "ci: update diagnostic xcodebuild log [skip ci]" || true
            git push -f origin diagnostics || true
          fi
